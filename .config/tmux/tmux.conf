# tmux — shared by vago (Fedora/Wayland), macOS and Termux.
# Prefix: C-Space. Plugins live in ~/.tmux/plugins and are managed by TPM.

# --- terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",tmux*:RGB"
set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on
# Let tmux forward the clipboard via OSC 52 (Termux, WezTerm, iTerm2).
set -g set-clipboard on

# --- prefix -----------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- mouse ------------------------------------------------------------------
# Termux delivers touches as mouse events, so mouse mode swallows swipe and
# long-press gestures. Keep it off on the phone and use the extra-keys row.
if-shell 'test -n "$TERMUX_VERSION"' \
    'set -g mouse off' \
    'set -g mouse on'

# --- panes and windows ------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-h previous-window
bind -n M-l next-window

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- copy mode --------------------------------------------------------------
set -g mode-keys vi
set -g status-keys vi

# Per-machine options (untracked), e.g. continuum boot on vago only.
if-shell 'test -f ~/.tmux.local.conf' 'source-file ~/.tmux.local.conf'

# --- plugins ----------------------------------------------------------------
set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Keep plugins outside the repo: TPM 3.x defaults to $XDG_CONFIG_HOME/tmux/plugins,
# which would land inside the stowed dotfiles tree.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

if-shell 'test -d ~/.tmux/plugins/tpm' 'run ~/.tmux/plugins/tpm/tpm'

# --- clipboard --------------------------------------------------------------
# Custom bindings come after TPM so they win over tmux-yank defaults.
# Copy chain: Termux API -> Wayland -> X11 -> macOS.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
    "termux-clipboard-set 2>/dev/null || wl-copy 2>/dev/null || xclip -r 2>/dev/null || pbcopy 2>/dev/null" \; \
    display-message "Copied to selection"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel \
    "termux-clipboard-set 2>/dev/null || wl-copy 2>/dev/null || xclip -r -selection clipboard 2>/dev/null || pbcopy 2>/dev/null" \; \
    display-message "Copied to clipboard"
bind-key C-p run-shell \
    "(termux-clipboard-get 2>/dev/null || wl-paste --no-newline 2>/dev/null || xclip -o -selection clipboard 2>/dev/null || pbpaste 2>/dev/null) | tmux load-buffer - && tmux paste-buffer"

# --- host badge (bottom-right) ----------------------------------------------
# Catppuccin rebuilds status-right on every config load, so append after it.
# The label defaults to the short hostname; set `@host_badge` per machine in
# ~/.tmux.local.conf (fold would otherwise read "localhost").
set -ag status-right "#[fg=#89b4fa,bg=#313244,nobold] #[fg=#1e1e2e,bg=#89b4fa,bold] 󰒋 #{?#{@host_badge},#{@host_badge},#{host_short}} #[fg=#cdd6f4,bg=#313244,nobold] "
